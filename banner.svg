<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080711" />
      <stop offset="50%" stop-color="#0f0c20" />
      <stop offset="100%" stop-color="#05040a" />
    </linearGradient>
    
    <!-- Accent Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#c621e5" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#c621e5" stop-opacity="0"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0% { opacity: 0.3; }
      50% { opacity: 0.7; }
      100% { opacity: 0.3; }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
      100% { transform: translateY(0px); }
    }
    @keyframes dash {
      to {
        stroke-dashoffset: -40;
      }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .grid-dot {
      fill: #2c254e;
      opacity: 0.45;
    }
    .neon-path {
      stroke: url(#cyanPurple);
      stroke-width: 1.5;
      stroke-dasharray: 20 20;
      animation: dash 6s linear infinite;
    }
    .title-text {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: 6px;
      fill: url(#cyanPurple);
      filter: url(#neonGlow);
      animation: float 4s ease-in-out infinite;
    }
    .subtitle-text {
      font-family: 'Outfit', system-ui, -apple-system, sans-serif;
      font-weight: 400;
      font-size: 14px;
      letter-spacing: 5px;
      fill: #a0aec0;
    }
    .tag-bg {
      fill: #141029;
      stroke: #312b60;
      stroke-width: 1.2;
    }
    .tag-text {
      font-family: monospace;
      font-size: 11px;
      fill: #00f2fe;
    }
    .pulse-circle {
      animation: blink 2s infinite;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="15" />
  
  <!-- Subtle Glowing background accent -->
  <circle cx="120" cy="60" r="180" fill="url(#glowGrad)" filter="url(#neonGlow)" />
  <circle cx="680" cy="180" r="150" fill="url(#glowGrad)" filter="url(#neonGlow)" opacity="0.6" />

  <!-- Dot Grid Pattern -->
  <g>
    <circle cx="50" cy="40" r="1.5" class="grid-dot" />
    <circle cx="100" cy="40" r="1.5" class="grid-dot" />
    <circle cx="150" cy="40" r="1.5" class="grid-dot" />
    <circle cx="200" cy="40" r="1.5" class="grid-dot" />
    <circle cx="250" cy="40" r="1.5" class="grid-dot" />
    <circle cx="300" cy="40" r="1.5" class="grid-dot" />
    <circle cx="350" cy="40" r="1.5" class="grid-dot" />
    <circle cx="400" cy="40" r="1.5" class="grid-dot" />
    <circle cx="450" cy="40" r="1.5" class="grid-dot" />
    <circle cx="500" cy="40" r="1.5" class="grid-dot" />
    <circle cx="550" cy="40" r="1.5" class="grid-dot" />
    <circle cx="600" cy="40" r="1.5" class="grid-dot" />
    <circle cx="650" cy="40" r="1.5" class="grid-dot" />
    <circle cx="700" cy="40" r="1.5" class="grid-dot" />
    <circle cx="750" cy="40" r="1.5" class="grid-dot" />
    
    <circle cx="50" cy="90" r="1.5" class="grid-dot" />
    <circle cx="100" cy="90" r="1.5" class="grid-dot" />
    <circle cx="700" cy="90" r="1.5" class="grid-dot" />
    <circle cx="750" cy="90" r="1.5" class="grid-dot" />

    <circle cx="50" cy="140" r="1.5" class="grid-dot" />
    <circle cx="100" cy="140" r="1.5" class="grid-dot" />
    <circle cx="700" cy="140" r="1.5" class="grid-dot" />
    <circle cx="750" cy="140" r="1.5" class="grid-dot" />

    <circle cx="50" cy="190" r="1.5" class="grid-dot" />
    <circle cx="100" cy="190" r="1.5" class="grid-dot" />
    <circle cx="150" cy="190" r="1.5" class="grid-dot" />
    <circle cx="200" cy="190" r="1.5" class="grid-dot" />
    <circle cx="250" cy="190" r="1.5" class="grid-dot" />
    <circle cx="300" cy="190" r="1.5" class="grid-dot" />
    <circle cx="350" cy="190" r="1.5" class="grid-dot" />
    <circle cx="400" cy="190" r="1.5" class="grid-dot" />
    <circle cx="450" cy="190" r="1.5" class="grid-dot" />
    <circle cx="500" cy="190" r="1.5" class="grid-dot" />
    <circle cx="550" cy="190" r="1.5" class="grid-dot" />
    <circle cx="600" cy="190" r="1.5" class="grid-dot" />
    <circle cx="650" cy="190" r="1.5" class="grid-dot" />
    <circle cx="700" cy="190" r="1.5" class="grid-dot" />
    <circle cx="750" cy="190" r="1.5" class="grid-dot" />
  </g>

  <!-- Glowing futuristic lines -->
  <line x1="50" y1="115" x2="250" y2="115" class="neon-path" />
  <line x1="550" y1="115" x2="750" y2="115" class="neon-path" />
  
  <!-- Left accent triangle -->
  <polygon points="50,105 50,125 60,115" fill="#00f2fe" filter="url(#softGlow)" />
  <!-- Right accent triangle -->
  <polygon points="750,105 750,125 740,115" fill="#c621e5" filter="url(#softGlow)" />

  <!-- Center Content -->
  <g transform="translate(400, 105)" text-anchor="middle">
    <!-- Main Title with animation class -->
    <text y="-5" class="title-text">HASAN HAMID</text>
    <!-- Subtitle -->
    <text y="35" class="subtitle-text">FULL-STACK DEVELOPER &amp; LINUX ENTHUSIAST</text>
  </g>

  <!-- Cyber System Badges at the bottom -->
  <g transform="translate(150, 205)">
    <rect x="0" y="-18" width="130" height="24" rx="12" class="tag-bg" />
    <circle cx="15" cy="-6" r="4" fill="#00f2fe" class="pulse-circle" filter="url(#softGlow)" />
    <text x="30" y="-2" class="tag-text">SYSTEM: ACTIVE</text>
  </g>

  <g transform="translate(520, 205)">
    <rect x="0" y="-18" width="130" height="24" rx="12" class="tag-bg" />
    <circle cx="15" cy="-6" r="4" fill="#c621e5" class="pulse-circle" filter="url(#softGlow)" />
    <text x="30" y="-2" class="tag-text">SHELL: HYPRLAND</text>
  </g>
</svg>
